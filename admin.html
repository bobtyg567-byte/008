<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Portfolio Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; }
        .admin-container { max-width: 1100px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 1.5rem; padding: 1.8rem; margin-bottom: 2rem; border: 1px solid #334155; }
        h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
        h2 { font-size: 1.4rem; margin: 1rem 0 1rem 0; border-left: 4px solid #3b82f6; padding-left: 0.75rem; }
        input, textarea { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.75rem; color: white; margin-bottom: 1rem; font-family: inherit; }
        button { background: #3b82f6; border: none; padding: 0.6rem 1.2rem; border-radius: 2rem; font-weight: 500; color: white; cursor: pointer; transition: 0.2s; margin-right: 0.6rem; margin-top: 0.3rem; }
        button:hover { background: #2563eb; transform: scale(0.97); }
        .danger-btn { background: #ef4444; }
        .danger-btn:hover { background: #dc2626; }
        .item-list { background: #0f172a; border-radius: 1rem; padding: 0.8rem; margin-bottom: 1rem; }
        .item { background: #1e293b; padding: 1rem; border-radius: 1rem; margin-bottom: 0.7rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .login-form { max-width: 400px; margin: 5rem auto; background: #1e293b; padding: 2rem; border-radius: 2rem; text-align: center; }
        .badge { background: #2dd4bf20; color: #5eead4; padding: 0.2rem 0.6rem; border-radius: 30px; font-size: 0.7rem; }
        hr { border-color: #334155; margin: 1rem 0; }
        .error-message { background: #7f1a1a; padding: 0.75rem; border-radius: 0.75rem; margin-bottom: 1rem; color: #fecaca; font-size: 0.85rem; }
        .loading { text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <div class="admin-container" id="adminContainer"></div>
    
    <!-- Include SheetDB JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/sheetdb-js@1.4.0/dist/sheetdb.min.js"></script>
    
    <script>
        const ADMIN_PASSWORD = 'Santonur2077runner';
        const SHEET_ID = 'aze92ll26mmmb';
        let isAuthenticated = false;
        let apiKey = '';
        let sheetdb = null;

        // --- Login UI ---
        function renderLogin(errorMsg = '') {
            document.getElementById('adminContainer').innerHTML = `
                <div class="login-form">
                    <i class="fas fa-lock" style="font-size: 2rem; color:#3b82f6;"></i>
                    <h2>Admin Access</h2>
                    ${errorMsg ? `<div class="error-message"><i class="fas fa-exclamation-triangle"></i> ${errorMsg}</div>` : ''}
                    <input type="password" id="adminPass" placeholder="Admin Password" autocomplete="off">
                    <input type="password" id="apiToken" placeholder="SheetDB API Key (Bearer Token)" autocomplete="off">
                    <button id="loginBtn">Authenticate <i class="fas fa-arrow-right"></i></button>
                    <div class="badge" style="margin-top: 1rem;">
                        <i class="fas fa-key"></i> Get your API key from SheetDB Dashboard → API Settings
                    </div>
                </div>
            `;
            document.getElementById('loginBtn').addEventListener('click', async () => {
                const password = document.getElementById('adminPass').value;
                const token = document.getElementById('apiToken').value.trim();
                if (password !== ADMIN_PASSWORD) {
                    renderLogin('Invalid admin password.');
                    return;
                }
                if (!token) {
                    renderLogin('API key is mandatory.');
                    return;
                }
                
                apiKey = token;
                
                // Initialize SheetDB with API key
                try {
                    sheetdb = new SheetDB(SHEET_ID, apiKey);
                    // Test the connection by trying to fetch data
                    await sheetdb.read({ sheet: 'profile' });
                    isAuthenticated = true;
                    await ensureDefaultData();
                    await renderAdminPanel();
                } catch (err) {
                    console.error('Auth error:', err);
                    renderLogin(`Authentication failed: ${err.message || 'Invalid API key or network error'}`);
                    apiKey = '';
                    sheetdb = null;
                }
            });
        }

        // --- Ensure default data exists ---
        async function ensureDefaultData() {
            try {
                // Check profile
                const profile = await sheetdb.read({ sheet: 'profile' });
                if (!profile || profile.length === 0) {
                    await sheetdb.create({ sheet: 'profile' }, { pictureurl: 'https://randomuser.me/api/portraits/women/68.jpg', name: 'Alex Morgan', description: 'Creative developer building impactful digital experiences.' });
                }
                
                // Check contact
                const contact = await sheetdb.read({ sheet: 'contact' });
                if (!contact || contact.length === 0) {
                    await sheetdb.create({ sheet: 'contact' }, { email: 'hello@alex.dev', phone: '+1 (555) 123-4567' });
                }
                
                // Check projects
                const projects = await sheetdb.read({ sheet: 'projects' });
                if (!projects || projects.length === 0) {
                    await sheetdb.create({ sheet: 'projects' }, { name: 'Sample Project', description: 'This is a demo project. You can edit or delete it.', livelink: 'https://example.com' });
                }
                
                // Check extra sections
                const extras = await sheetdb.read({ sheet: 'extra' });
                if (!extras || extras.length === 0) {
                    await sheetdb.create({ sheet: 'extra' }, { title: '⚡ Core Skills', content: '<ul><li>React / Next.js</li><li>Node.js</li><li>UI/UX Design</li></ul>' });
                }
            } catch (err) {
                console.error('Error initializing default data:', err);
            }
        }

        // --- Admin Dashboard ---
        async function renderAdminPanel() {
            const container = document.getElementById('adminContainer');
            container.innerHTML = `<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading dashboard...</div>`;
            
            try {
                // Fetch all data
                const profileData = await sheetdb.read({ sheet: 'profile' });
                const contactData = await sheetdb.read({ sheet: 'contact' });
                const projectsData = await sheetdb.read({ sheet: 'projects' });
                const extrasData = await sheetdb.read({ sheet: 'extra' });
                
                const profile = profileData?.[0] || {};
                const contact = contactData?.[0] || {};
                const projects = Array.isArray(projectsData) ? projectsData : [];
                const extras = Array.isArray(extrasData) ? extrasData : [];

                let html = `
                    <div class="card">
                        <h1><i class="fas fa-sliders-h"></i> Portfolio Admin 
                            <button id="logoutBtn" class="danger-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                        </h1>
                    </div>
                    
                    <!-- Profile Section -->
                    <div class="card">
                        <h2><i class="fas fa-user-circle"></i> Profile</h2>
                        <input type="text" id="profilePicture" placeholder="Picture URL (online link)" value="${escapeHtml(profile.pictureurl || '')}">
                        <input type="text" id="profileName" placeholder="Full Name" value="${escapeHtml(profile.name || '')}">
                        <textarea id="profileDescription" rows="3" placeholder="Bio / Description">${escapeHtml(profile.description || '')}</textarea>
                        <button id="saveProfileBtn">Save Profile</button>
                    </div>
                    
                    <!-- Contact Section -->
                    <div class="card">
                        <h2><i class="fas fa-id-card"></i> Contact Information</h2>
                        <input type="email" id="contactEmail" placeholder="Email Address" value="${escapeHtml(contact.email || '')}">
                        <input type="text" id="contactPhone" placeholder="Phone Number" value="${escapeHtml(contact.phone || '')}">
                        <button id="saveContactBtn">Save Contact</button>
                    </div>
                    
                    <!-- Projects Section -->
                    <div class="card">
                        <h2><i class="fas fa-tasks"></i> Projects (${projects.length})</h2>
                        <div id="projectsList"></div>
                        <hr>
                        <h3><i class="fas fa-plus-circle"></i> Add New Project</h3>
                        <input type="text" id="newProjectName" placeholder="Project Name">
                        <textarea id="newProjectDesc" rows="2" placeholder="Project Description"></textarea>
                        <input type="text" id="newProjectLink" placeholder="Live Link URL">
                        <button id="addProjectBtn">Add Project</button>
                    </div>
                    
                    <!-- Custom Sections -->
                    <div class="card">
                        <h2><i class="fas fa-cubes"></i> Custom Sections (${extras.length})</h2>
                        <div id="extrasList"></div>
                        <hr>
                        <h3><i class="fas fa-plus-circle"></i> Add New Custom Section</h3>
                        <input type="text" id="newExtraTitle" placeholder="Section Title (e.g., Skills, Awards, Testimonials)">
                        <textarea id="newExtraContent" rows="3" placeholder="Content (HTML allowed - you can use &lt;ul&gt;, &lt;li&gt;, &lt;p&gt;, etc.)"></textarea>
                        <button id="addExtraBtn">Add Section</button>
                        <div class="badge" style="margin-top: 10px;">
                            <i class="fas fa-info-circle"></i> Tip: Use HTML for rich formatting
                        </div>
                    </div>
                `;
                
                container.innerHTML = html;
                
                // Render Projects List
                function renderProjects() {
                    const projDiv = document.getElementById('projectsList');
                    if (!projDiv) return;
                    if (projects.length === 0) {
                        projDiv.innerHTML = '<div class="item-list">✨ No projects yet. Add your first project above.</div>';
                        return;
                    }
                    let list = '<div class="item-list">';
                    projects.forEach((project, index) => {
                        list += `
                            <div class="item">
                                <div>
                                    <strong>${escapeHtml(project.name)}</strong><br>
                                    <small>${escapeHtml((project.description || '').substring(0, 80))}</small><br>
                                    <span class="badge">🔗 ${escapeHtml(project.livelink || 'no link')}</span>
                                </div>
                                <div>
                                    <button class="editProjectBtn" data-index="${index}" data-name="${escapeHtml(project.name)}" data-desc="${escapeHtml(project.description || '')}" data-link="${escapeHtml(project.livelink || '')}">✏️ Edit</button>
                                    <button class="deleteProjectBtn" data-index="${index}" data-name="${escapeHtml(project.name)}" style="background:#b91c1c;">🗑️ Delete</button>
                                </div>
                            </div>
                        `;
                    });
                    list += '</div>';
                    projDiv.innerHTML = list;
                    
                    // Edit Project
                    document.querySelectorAll('.editProjectBtn').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const index = parseInt(btn.getAttribute('data-index'));
                            const project = projects[index];
                            const newName = prompt('Edit project name:', project.name);
                            if (!newName) return;
                            const newDesc = prompt('Edit description:', project.description);
                            const newLink = prompt('Edit live link URL:', project.livelink);
                            
                            try {
                                // Get the row ID from SheetDB (usually auto-generated)
                                if (project._id) {
                                    await sheetdb.update({ sheet: 'projects', id: project._id }, {
                                        name: newName,
                                        description: newDesc || '',
                                        livelink: newLink || ''
                                    });
                                } else {
                                    // Fallback: update using search
                                    await sheetdb.update({ sheet: 'projects', search: { name: project.name } }, {
                                        name: newName,
                                        description: newDesc || '',
                                        livelink: newLink || ''
                                    });
                                }
                                alert('✅ Project updated successfully!');
                                await renderAdminPanel();
                            } catch (err) {
                                alert('❌ Update failed: ' + err.message);
                            }
                        });
                    });
                    
                    // Delete Project
                    document.querySelectorAll('.deleteProjectBtn').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const index = parseInt(btn.getAttribute('data-index'));
                            const project = projects[index];
                            if (confirm(`Delete project "${project.name}"? This cannot be undone.`)) {
                                try {
                                    if (project._id) {
                                        await sheetdb.delete({ sheet: 'projects', id: project._id });
                                    } else {
                                        await sheetdb.delete({ sheet: 'projects', search: { name: project.name } });
                                    }
                                    alert('✅ Project deleted successfully!');
                                    await renderAdminPanel();
                                } catch (err) {
                                    alert('❌ Delete failed: ' + err.message);
                                }
                            }
                        });
                    });
                }
                
                // Render Extras List
                function renderExtras() {
                    const extraDiv = document.getElementById('extrasList');
                    if (!extraDiv) return;
                    if (extras.length === 0) {
                        extraDiv.innerHTML = '<div class="item-list">📦 No custom sections yet. Add your first section above.</div>';
                        return;
                    }
                    let list = '<div class="item-list">';
                    extras.forEach((section, index) => {
                        list += `
                            <div class="item">
                                <div>
                                    <strong>${escapeHtml(section.title)}</strong><br>
                                    <small>${escapeHtml((section.content || '').substring(0, 70))}</small>
                                </div>
                                <div>
                                    <button class="editExtraBtn" data-index="${index}" data-title="${escapeHtml(section.title)}" data-content="${escapeHtml(section.content || '')}">✏️ Edit</button>
                                    <button class="deleteExtraBtn" data-index="${index}" data-title="${escapeHtml(section.title)}" style="background:#b91c1c;">🗑️ Delete</button>
                                </div>
                            </div>
                        `;
                    });
                    list += '</div>';
                    extraDiv.innerHTML = list;
                    
                    // Edit Extra
                    document.querySelectorAll('.editExtraBtn').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const index = parseInt(btn.getAttribute('data-index'));
                            const section = extras[index];
                            const newTitle = prompt('Edit section title:', section.title);
                            if (!newTitle) return;
                            const newContent = prompt('Edit content (HTML allowed):', section.content);
                            
                            try {
                                if (section._id) {
                                    await sheetdb.update({ sheet: 'extra', id: section._id }, {
                                        title: newTitle,
                                        content: newContent || ''
                                    });
                                } else {
                                    await sheetdb.update({ sheet: 'extra', search: { title: section.title } }, {
                                        title: newTitle,
                                        content: newContent || ''
                                    });
                                }
                                alert('✅ Section updated successfully!');
                                await renderAdminPanel();
                            } catch (err) {
                                alert('❌ Update failed: ' + err.message);
                            }
                        });
                    });
                    
                    // Delete Extra
                    document.querySelectorAll('.deleteExtraBtn').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const index = parseInt(btn.getAttribute('data-index'));
                            const section = extras[index];
                            if (confirm(`Delete section "${section.title}"? This will remove all content.`)) {
                                try {
                                    if (section._id) {
                                        await sheetdb.delete({ sheet: 'extra', id: section._id });
                                    } else {
                                        await sheetdb.delete({ sheet: 'extra', search: { title: section.title } });
                                    }
                                    alert('✅ Section deleted successfully!');
                                    await renderAdminPanel();
                                } catch (err) {
                                    alert('❌ Delete failed: ' + err.message);
                                }
                            }
                        });
                    });
                }
                
                // Save Profile
                document.getElementById('saveProfileBtn').addEventListener('click', async () => {
                    const data = {
                        pictureurl: document.getElementById('profilePicture').value,
                        name: document.getElementById('profileName').value,
                        description: document.getElementById('profileDescription').value
                    };
                    try {
                        if (profile._id) {
                            await sheetdb.update({ sheet: 'profile', id: profile._id }, data);
                        } else {
                            await sheetdb.update({ sheet: 'profile', search: {} }, data);
                        }
                        alert('✅ Profile saved successfully!');
                        await renderAdminPanel();
                    } catch (err) {
                        alert('❌ Save failed: ' + err.message);
                    }
                });
                
                // Save Contact
                document.getElementById('saveContactBtn').addEventListener('click', async () => {
                    const data = {
                        email: document.getElementById('contactEmail').value,
                        phone: document.getElementById('contactPhone').value
                    };
                    try {
                        if (contact._id) {
                            await sheetdb.update({ sheet: 'contact', id: contact._id }, data);
                        } else {
                            await sheetdb.update({ sheet: 'contact', search: {} }, data);
                        }
                        alert('✅ Contact saved successfully!');
                        await renderAdminPanel();
                    } catch (err) {
                        alert('❌ Save failed: ' + err.message);
                    }
                });
                
                // Add Project
                document.getElementById('addProjectBtn').addEventListener('click', async () => {
                    const name = document.getElementById('newProjectName').value.trim();
                    if (!name) {
                        alert('Project name is required.');
                        return;
                    }
                    const desc = document.getElementById('newProjectDesc').value.trim();
                    const link = document.getElementById('newProjectLink').value.trim();
                    
                    try {
                        await sheetdb.create({ sheet: 'projects' }, {
                            name: name,
                            description: desc,
                            livelink: link || ''
                        });
                        alert('✅ Project added successfully!');
                        await renderAdminPanel();
                    } catch (err) {
                        alert('❌ Add failed: ' + err.message);
                    }
                });
                
                // Add Extra Section
                document.getElementById('addExtraBtn').addEventListener('click', async () => {
                    const title = document.getElementById('newExtraTitle').value.trim();
                    if (!title) {
                        alert('Section title is required.');
                        return;
                    }
                    const content = document.getElementById('newExtraContent').value;
                    
                    try {
                        await sheetdb.create({ sheet: 'extra' }, {
                            title: title,
                            content: content || '<p>New custom section content</p>'
                        });
                        alert('✅ Section added successfully!');
                        await renderAdminPanel();
                    } catch (err) {
                        alert('❌ Add failed: ' + err.message);
                    }
                });
                
                // Logout
                document.getElementById('logoutBtn').addEventListener('click', () => {
                    isAuthenticated = false;
                    apiKey = '';
                    sheetdb = null;
                    renderLogin();
                });
                
                renderProjects();
                renderExtras();
                
            } catch (err) {
                console.error('Dashboard error:', err);
                container.innerHTML = `<div class="card"><h2>Error</h2><p>${escapeHtml(err.message)}</p><button onclick="location.reload()">Try Again</button></div>`;
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
        }
        
        // Start the app
        renderLogin();
    </script>
</body>
</html>
